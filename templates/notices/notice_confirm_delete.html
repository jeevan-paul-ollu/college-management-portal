{% extends 'base.html' %}

{% block title %}
Delete Notice
{% endblock %}

{% block content %}

<div class="card">

    <h1>
        Delete Notice
    </h1>


    <p>
        Are you sure you want to delete this notice?
    </p>


    <h2>
        {{ notice.title }}
    </h2>


    <p>
        Category:
        {{ notice.category }}
    </p>


    <form method="POST">

        {% csrf_token %}


        <div class="form-buttons">

            <button
                type="submit"
                class="btn-danger">

                Yes, Delete

            </button>


            <a
                href="{% url 'notice_list' %}"
                class="btn-secondary">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
