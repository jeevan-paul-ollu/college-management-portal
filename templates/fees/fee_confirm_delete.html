{% extends 'base.html' %}

{% block title %}
Delete Fee
{% endblock %}


{% block content %}

<div class="card">

    <h1>
        Delete Fee Record
    </h1>


    <p>
        Are you sure you want to delete this fee record?
    </p>


    <h3>

        {{ fee.student.first_name }}
        {{ fee.student.last_name }}

    </h3>


    <p>
        Academic Year:
        {{ fee.academic_year }}
    </p>


    <form method="POST">

        {% csrf_token %}

        <div class="form-buttons">

            <button
                type="submit"
                class="btn-danger">

                Yes, Delete

            </button>


            <a
                href="{% url 'fee_list' %}"
                class="btn-secondary">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
