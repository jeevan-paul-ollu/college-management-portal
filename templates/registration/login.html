{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>
            🎓 College Portal
        </h1>

        <p style="text-align: center; color: #6b7280;">
            Login to continue
        </p>


        {% if form.errors %}

        <div class="error-message">

            Username or password is incorrect.

        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                {{ form.username }}

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                {{ form.password }}

            </div>


            <button
                type="submit"
                class="btn-primary">

                Login

            </button>

        </form>

    </div>

</div>

{% endblock %}
